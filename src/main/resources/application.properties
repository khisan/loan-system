spring.application.name=loan-system

spring.datasource.url=jdbc:postgresql://localhost:5432/loan_system
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Email notifications (Mailpit by default: SMTP 1025, UI http://localhost:8025)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:loan-system@localhost}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

server.port=8080
server.address=0.0.0.0

logging.level.org.springframework.security=DEBUG


